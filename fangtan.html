  <link rel="stylesheet" href="css/style.css" />
  <style>
    .ft-page { padding: 8rem 10% 5rem; }
    .ft-header { margin-bottom: 3.5rem; }
    .ft-back { font-size: 0.78rem; letter-spacing: 0.15em; color: var(--accent); text-decoration: none; display: inline-block; margin-bottom: 1.5rem; }
    .ft-back:hover { opacity: 0.7; }
    .ft-tag { font-size: 0.7rem; letter-spacing: 0.3em; color: var(--muted); text-transform: uppercase; margin-bottom: 0.7rem; }
    .ft-title { font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 300; letter-spacing: 0.08em; margin-bottom: 0.6rem; }
    .ft-sub { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.1em; }

    .ft-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
    }
    @media (max-width: 640px) {
      .ft-grid { grid-template-columns: 1fr; }
      .ft-page { padding: 6rem 3% 4rem; }
    }

    .ft-card {
      cursor: pointer;
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .ft-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.12); }

    .ft-thumb {
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
    }
    .ft-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .ft-card:hover .ft-thumb img { transform: scale(1.04); }

    .ft-play {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.15);
      transition: background 0.3s;
    }
    .ft-card:hover .ft-play { background: rgba(0,0,0,0.3); }
    .ft-play-circle {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      padding-left: 4px;
      color: #2C2416;
      transition: transform 0.25s;
    }
    .ft-card:hover .ft-play-circle { transform: scale(1.1); }

    .ft-info { padding: 1.2rem 1.4rem 1.4rem; }
    .ft-label {
      font-size: 0.68rem; letter-spacing: 0.2em;
      color: var(--accent); text-transform: uppercase; margin-bottom: 0.5rem;
    }
    .ft-name { font-size: 1rem; color: var(--text); font-weight: 400; letter-spacing: 0.04em; }

    /* lightbox */
    .ft-lightbox {
      display: none; position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,0.92);
      align-items: center; justify-content: center;
    }
    .ft-lightbox.open { display: flex; }
    .ft-lb-inner {
      position: relative;
      width: min(880px, 92vw);
      aspect-ratio: 16/9;
    }
    .ft-lb-inner iframe {
      width: 100%; height: 100%;
      border: none; border-radius: 4px;
    }
    .ft-lb-close {
      position: absolute; top: -2.5rem; right: 0;
      background: none; border: none;
      color: #fff; font-size: 2rem; cursor: pointer; line-height: 1;
      opacity: 0.8; transition: opacity 0.2s;
    }
    .ft-lb-close:hover { opacity: 1; }
  </style>
</head>

  <script src="js/main.js"></script>
  <script>
    const cards = document.querySelectorAll('.ft-card');
    const lightbox = document.getElementById('ft-lightbox');
    const iframe = document.getElementById('ft-lb-iframe');
    const closeBtn = document.getElementById('ft-lb-close');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        const id = card.dataset.id;
        if (!id) return;
        const type = card.dataset.type || 'drive';
        if (type === 'youtube') {
          iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
        } else {
          iframe.src = `https://drive.google.com/file/d/${id}/preview?autoplay=1`;
        }
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      });
    });

    function closeLightbox() {
      lightbox.classList.remove('open');
      iframe.src = '';
      document.body.style.overflow = '';
    }

    closeBtn.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  </script>
